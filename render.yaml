services:
  - type: web
    name: news-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python trigger_server.py
    envVars:
      - key: CRON_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
