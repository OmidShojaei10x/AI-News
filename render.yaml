services:
  - type: cron
    name: news-ai-morning
    runtime: python
    plan: starter
    schedule: "30 5 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: CHECK_SLOT=morning FORCE_SEND=true python main.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  - type: cron
    name: news-ai-noon
    runtime: python
    plan: starter
    schedule: "30 8 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: CHECK_SLOT=noon FORCE_SEND=true python main.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  - type: cron
    name: news-ai-evening
    runtime: python
    plan: starter
    schedule: "30 17 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: CHECK_SLOT=evening FORCE_SEND=true python main.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
