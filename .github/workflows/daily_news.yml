name: AI News Fetch (Cursor Automation handles processing)

on:
  workflow_dispatch:
    inputs:
      check_slot:
        description: "Check slot override"
        type: choice
        options:
          - morning
          - noon
          - evening
        default: morning

jobs:
  fetch-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch articles (Composer processes in Cursor Automation)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CHECK_SLOT: ${{ inputs.check_slot }}
        run: python scripts/fetch_articles.py
